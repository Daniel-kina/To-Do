<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>
</head>
<body>
    <div class="sidebar">
        <div class="user-area">
            <div class="user-profile">
                <img src="./images/frau_lacht.webp" alt="frau">
                <div class="user-name">
                    <div>Denise</div>
                    <img src="./images/arrow-down.svg" alt="">
                </div>
            </div>
            <div class="user-toolbelt">
                <img src="./images/notification-bell.svg" alt="B">
                <img src="./images/sidebar-toggle.svg" alt="">
            </div>
        </div>

        <div class="sidebar-content">
            <div class="tools sidebar-section">
                <div class="option">
                    <img src="./images/plus.svg" alt="i">
                    <div>Aufgabe Hinzufügen</div>
                </div>
                <div class="option">
                    <img src="./images/plus.svg" alt="i">
                    <div>Suchen</div>
                </div>
                <div class="option">
                    <img src="./images/plus.svg" alt="i">
                    <div>Eingang</div>
                </div>
                <div class="option">
                    <img src="./images/plus.svg" alt="i">
                    <div>Heute</div>
                </div>
                <div class="option">
                    <img src="./images/plus.svg" alt="i">
                    <div>Demnächst</div>
                </div>
            </div>

            <div class="projects-wrapper sidebar-section">
                <div class="option project">
                    <div>
                        <img src="./images/plus.svg" alt="">
                    </div>
                    <div>
                        Meine Projekte
                    </div>
                    
                </div>
                <div class="projects-list">

                </div>

                <div id="create-project-btn-wrapper">
                    <button class="create-project-btn">Projekt erstellen</button>
                </div>
                
            </div>
            
        </div>
    </div>
    <div class="main-content-wrapper">
        <h1 class="todos-main-title">HEUTE</h1>
        <div class="todos">

            
        </div>
        <div class="add-todo">
            <img src="./images/plus.svg" alt="">
            <div class="add-todo-text">
                Aufgabe hinzufügen
            </div>
        </div>
    </div>
</body>
</html>
